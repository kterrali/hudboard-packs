name: build-pack

on:
  push:
    paths:
      - 'packs/**'
      - '.github/workflows/build.yml'
    branches: [main]
  pull_request:
    paths:
      - 'packs/**'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate pack manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every pack's manifest.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const packsDir = 'packs';
            if (!fs.existsSync(packsDir)) {
              core.info('No packs directory found, skipping.');
              return;
            }
            const packs = fs.readdirSync(packsDir).filter(f =>
              fs.statSync(path.join(packsDir, f)).isDirectory()
            );
            if (packs.length === 0) {
              core.warning('No packs found.');
              return;
            }
            let errors = 0;
            for (const pack of packs) {
              const mPath = path.join(packsDir, pack, 'manifest.json');
              if (!fs.existsSync(mPath)) {
                core.error(`❌ ${pack}: missing manifest.json`);
                errors++;
                continue;
              }
              try {
                const m = JSON.parse(fs.readFileSync(mPath, 'utf8'));
                const required = ['name', 'slug', 'version', 'description', 'panels'];
                for (const k of required) {
                  if (!m[k]) {
                    core.error(`❌ ${pack}: manifest.json missing "${k}"`);
                    errors++;
                  }
                }
                if (m.slug !== pack) {
                  core.error(`❌ ${pack}: manifest.slug "${m.slug}" doesn't match folder name "${pack}"`);
                  errors++;
                }
                core.info(`✅ ${pack} v${m.version} — ${m.panels} panel(s)`);
              } catch (e) {
                core.error(`❌ ${pack}: invalid JSON — ${e.message}`);
                errors++;
              }
            }
            if (errors > 0) {
              core.setFailed(`${errors} manifest error(s)`);
            }

  build:
    name: Build pack ZIPs
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP per pack
        run: |
          mkdir -p dist
          for pack in packs/*/; do
            if [ -d "$pack" ]; then
              name=$(basename "$pack")
              echo "Packaging $name..."
              cd "$pack"
              zip -r "../../dist/${name}.zip" . -x "*.DS_Store"
              cd ../..
            fi
          done
          echo "Generated archives:"
          ls -la dist/

      - name: Upload ZIPs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hudboard-pack-zips
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built ZIPs
        uses: actions/download-artifact@v4
        with:
          name: hudboard-pack-zips
          path: dist

      - name: Determine release tag
        id: tag
        run: |
          # Use the most recently modified folder's slug as the tag name
          PACK=$(ls -1 packs/ | head -1)
          VERSION=$(python3 -c "import json; print(json.load(open('packs/${PACK}/manifest.json'))['version'])" 2>/dev/null || echo "1.0.0")
          TAG="v${VERSION}-${PACK}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      - name: Create GitHub release with ZIPs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: dist/*.zip
